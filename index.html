<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Focus Flow</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1>🌱 Focus Flow</h1>
      <p class="subtitle">Enfócate. Cada sesión completada planta una flor.</p>
    </header>

    <main class="layout">
      <section class="timer-card">
        <div class="mode-pill" id="modePill">Enfoque</div>

        <div class="ring-wrap">
          <svg class="ring" viewBox="0 0 220 220">
            <circle class="ring-bg" cx="110" cy="110" r="100"></circle>
            <circle class="ring-progress" id="ringProgress" cx="110" cy="110" r="100"></circle>
          </svg>
          <div class="ring-center">
            <span class="time" id="timeDisplay">25:00</span>
            <span class="session-label" id="sessionLabel">Sesión 1</span>
          </div>
        </div>

        <div class="controls">
          <button class="btn btn-secondary" id="resetBtn" title="Reiniciar">↺</button>
          <button class="btn btn-primary" id="startBtn">Iniciar</button>
          <button class="btn btn-secondary" id="skipBtn" title="Saltar">⏭</button>
        </div>

        <div class="settings">
          <label>
            Enfoque
            <input type="number" id="focusMinutes" min="1" max="120" value="25" />
            min
          </label>
          <label>
            Descanso
            <input type="number" id="breakMinutes" min="1" max="60" value="5" />
            min
          </label>
          <label class="checkbox-label">
            <input type="checkbox" id="autoStart" checked />
            Auto-continuar
          </label>
        </div>

        <div class="stats">
          <div class="stat">
            <span class="stat-value" id="statToday">0</span>
            <span class="stat-name">hoy</span>
          </div>
          <div class="stat">
            <span class="stat-value" id="statTotal">0</span>
            <span class="stat-name">flores</span>
          </div>
          <div class="stat">
            <span class="stat-value" id="statStreak">0</span>
            <span class="stat-name">racha 🔥</span>
          </div>
        </div>
      </section>

      <section class="garden-card">
        <div class="garden-header">
          <h2>Tu jardín</h2>
          <button class="btn btn-ghost" id="clearGardenBtn">Limpiar</button>
        </div>
        <div class="garden" id="garden">
          <div class="garden-empty" id="gardenEmpty">Aún no hay flores. Completa una sesión de enfoque para plantar la primera 🌼</div>
        </div>
      </section>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
